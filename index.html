    .hidden { display: none !important; }
    @media (max-width: 980px) {

      .sidebar { width: 100%; min-width: 0; height: auto; max-height: 45vh; }
      .main { height: auto; overflow: visible; padding: 18px; }
      .grid, .form-grid, .pq-body { grid-template-columns: 1fr; }
      .span-3, .span-4, .span-5, .span-6, .span-7, .span-8, .span-12 { grid-column: span 1; }
      .audit-card { grid-template-columns: 1fr; }

    @media print {
      body { display: block; height: auto; overflow: visible; background: #fff; }
      .sidebar, .top-actions, .toolbar, .btn { display: none !important; }
      .main { padding: 0; overflow: visible; }
      .section { display: none !important; }
      .section.active { display: block !important; }
      .card, .pq-card, .table-wrap { box-shadow: none; break-inside: avoid; }
    }
  </style>

  function escapeHtml(value) {
    return String(value ?? "")
      .replace(/&/g, "&amp;")
      .replace(/</g, "&lt;")
      .replace(/>/g, "&gt;")
      .replace(/\"/g, "&quot;")
      .replace(/'/g, "&#039;");
  }
  function today() { return new Date().toISOString().slice(0, 10); }
  function addDays(dateText, days) {
    if (!dateText) return "";
    const d = new Date(dateText + "T00:00:00");
    d.setDate(d.getDate() + Number(days));
    return d.toISOString().slice(0, 10);
  }
  function uid(prefix) {
    const stamp = new Date().toISOString().replace(/[-:.TZ]/g, "").slice(0, 14);

    return `${prefix}-${stamp}-${rand}`;

  async function saveRecord(collectionName, id, data) {
    const rows = localRead(collectionName);
    const existingIndex = rows.findIndex(x => (x.id || x[`${collectionName.slice(0,-1)}Id`] || x.auditId || x.programId || x.findingId || x.capPlanId || x.capStepId || x.revisionId || x.organizationId) === id);
    const row = { ...data, id };
    if (existingIndex >= 0) rows[existingIndex] = row;
    else rows.push(row);
    localWrite(collectionName, rows);
    if (state.db) {
      try { await setDoc(doc(state.db, collectionName, id), row, { merge: true }); }
      catch (err) { console.warn("Firestore save failed, local copy kept", collectionName, err); }
    }
  }
  async function updateRecord(collectionName, id, patch) {
    const rows = localRead(collectionName);
    const idx = rows.findIndex(x => (x.id || x.auditId || x.programId || x.findingId || x.capPlanId || x.capStepId || x.revisionId || x.organizationId) === id);
    if (idx >= 0) rows[idx] = { ...rows[idx], ...patch, updatedAt: new Date().toISOString() };
    localWrite(collectionName, rows);
    if (state.db) {
      try { await updateDoc(doc(state.db, collectionName, id), { ...patch, updatedAt: new Date().toISOString() }); }
      catch (err) { console.warn("Firestore update failed", collectionName, err); }
    }
  }
  async function readCollection(collectionName) {
    if (state.db) {
      try {
        const snap = await getDocs(collection(state.db, collectionName));
        const rows = snap.docs.map(d => ({ id: d.id, ...d.data() }));
        localWrite(collectionName, rows);
        return rows;
      } catch (err) {
        console.warn("Firestore read failed, using localStorage", collectionName, err);
      }
    }
    return localRead(collectionName);
  }

  function getRowsFromModel(model) {
    if (Array.isArray(model)) return model;
    if (model && Array.isArray(model.rows)) return model.rows;
    if (model && Array.isArray(model.sheets)) return model.sheets.flatMap(sheet => Array.isArray(sheet.rows) ? sheet.rows : []);
    return [];
  }
  function normalizeRow(row) {
    return {
      pqNo: row["PQ Number"] ?? row.no ?? "",
      areaKey: String(row["Audit Area"] ?? row.area ?? "").trim().toUpperCase(),
      ce: row["CE Code"] ?? row.ce ?? "",
      questionEn: row["PQ Question"] ?? row.question_en ?? "",
      questionTr: row["PQ Sorusu"] ?? row.question_tr ?? "",
      reference: row.Reference ?? row.reference ?? "",
      reviewEvidenceEn: row["Review Evidence"] ?? row.review_evidence_en ?? "",
      reviewEvidenceTr: row["İncelenecek Kanıtlar"] ?? row["Incelenecek Kanitlar"] ?? row.review_evidence_tr ?? "",
      onSiteRequired: asBool(row.OnSiteRequired ?? row["OnSiteRequired"]),
      ppq: asBool(row["Is PPQ"] ?? row.ppq ?? row.is_ppq)
    };
  }
  function extractNotesAndCriteria(fullText) {
    if (!fullText) return { criteriaLines: [], noteText: "" };
    const lines = String(fullText).split("\n");
    const noteLabelRegex = /^\s*(notes? to the auditor:|note to the auditor:|denetçiye not(?:lar|u)?\s*:|denetciye not(?:lar|u)?\s*:)\s*/i;
    let foundNote = false;
    const criteriaLines = [];
    let noteText = "";
    for (const line of lines) {
      const clean = line.trim();
      if (!clean) continue;
      if (noteLabelRegex.test(clean)) {
        foundNote = true;
        const rest = line.replace(noteLabelRegex, "").trim();
        if (rest) noteText += (noteText ? "\n" : "") + rest;
        continue;
      }
      if (foundNote) noteText += (noteText ? "\n" : "") + line;
      else criteriaLines.push(line);
    }
    return { criteriaLines, noteText };
  }
  function criteriaCount(row) {
    const parsedTr = extractNotesAndCriteria(row.reviewEvidenceTr);
    const parsedEn = extractNotesAndCriteria(row.reviewEvidenceEn);
    return Math.max(parsedTr.criteriaLines.length, parsedEn.criteriaLines.length, 0);
  }

    }
  }

  async function loadMasterModel() {
    const response = await fetch(DATA_FILE, { cache: "no-store" });
    if (!response.ok) throw new Error(`${DATA_FILE} okunamadı.`);
    const model = await response.json();
    state.masterRows = getRowsFromModel(model).map(normalizeRow).filter(x => x.areaKey);
    AREA_ORDER.forEach(area => {
      const rows = state.masterRows.filter(row => row.areaKey === area);
      state.normalizedAreas[area] = { areaKey: area, areaName: AREA_LABELS[area], rows };
    });
  }

    state.auditPrograms = await readCollection(COLLECTIONS.auditPrograms);
    state.audits = await readCollection(COLLECTIONS.audits);
    state.organizations = await readCollection(COLLECTIONS.organizations);
    state.findings = await readCollection(COLLECTIONS.findings);
    state.capPlans = await readCollection(COLLECTIONS.capPlans);
    state.capSteps = await readCollection(COLLECTIONS.capSteps);
    state.formRevisions = await readCollection(COLLECTIONS.formRevisions);
    ensureDefaultRevisions();

  function ensureDefaultRevisions() {
    const existing = new Set(state.formRevisions.map(r => r.formId));
    AREA_ORDER.forEach(area => {
      if (!existing.has(area)) {
        state.formRevisions.push({
          id: `${area}-REV-JSON-CURRENT`,
          revisionId: `${area}-REV-JSON-CURRENT`,
          formId: area,
          revisionNo: "JSON-CURRENT",
          effectiveDate: today(),
          changeSummary: `${DATA_FILE} içindeki aktif master veri seti.` ,
          status: "active",
          sourceFile: DATA_FILE,
          rowCount: state.normalizedAreas[area]?.rows?.length || 0,
          createdAt: new Date().toISOString(),
          localOnly: true
        });
      }
    });
  }

  window.createRevisionMeta = async function(area) {

    if (!revNo) return;
    const revisionId = `${area}-REV-${revNo}`.replace(/\s+/g, "-");
    const data = {
      revisionId,
      formId: area,
      revisionNo: revNo,
      effectiveDate: today(),
      changeSummary: prompt("Değişiklik özeti", "Revizyon metadata kaydı oluşturuldu.") || "",
      changedBy: state.role,
      status: "active",
      sourceFile: DATA_FILE,
      rowCount: state.normalizedAreas[area]?.rows?.length || 0,
      createdAt: new Date().toISOString(),
      updatedAt: new Date().toISOString()
    };
    state.formRevisions = state.formRevisions.map(r => r.formId === area ? { ...r, status: "archived", updatedAt: new Date().toISOString() } : r);
    for (const old of state.formRevisions.filter(r => r.formId === area && r.status === "archived" && !r.localOnly)) await saveRecord(COLLECTIONS.formRevisions, old.revisionId || old.id, old);
    state.formRevisions.push(data);
    await saveRecord(COLLECTIONS.formRevisions, revisionId, data);
    renderAll();
    showSection("formRevisions");
  };

  window.savePlannedAudit = async function() {
    const programId = document.getElementById("auditProgramSelect").value;
    if (!programId) return alert("Yıllık program seçin.");
    const orgName = document.getElementById("auditOrgName").value.trim();
    if (!orgName) return alert("Kuruluş / işletme adı girin.");
    const selectedForms = [...document.querySelectorAll("input[name='auditForms']:checked")].map(cb => cb.value);
    if (!selectedForms.length) return alert("En az bir kontrol formu seçin.");
    const start = document.getElementById("auditStart").value;
    const end = document.getElementById("auditEnd").value;
    if (!start || !end) return alert("Planlı başlangıç ve bitiş tarihlerini girin.");
    const orgId = `org_${orgName.toLowerCase().replace(/[^a-z0-9ğüşöçıİĞÜŞÖÇ]+/gi, "_").replace(/^_+|_+$/g, "").slice(0, 40) || "demo"}`;
    const auditId = uid(`AUDIT-${new Date(start).getFullYear()}`);
    const selectedFormRevisions = {};
    selectedForms.forEach(area => {
      const rev = state.formRevisions.find(r => r.formId === area && r.status === "active");
      selectedFormRevisions[area] = rev?.revisionId || `${area}-REV-JSON-CURRENT`;
    });
    await saveRecord(COLLECTIONS.organizations, orgId, { organizationId: orgId, name: orgName, type: "Kuruluş", active: true, createdAt: new Date().toISOString(), updatedAt: new Date().toISOString() });
    const data = {
      auditId,
      programId,
      organizationId: orgId,
      organizationName: orgName,
      selectedForms,
      selectedFormRevisions,
      auditType: document.getElementById("auditType").value,
      auditMethod: document.getElementById("auditMethod").value,
      plannedStartDate: start,
      plannedEndDate: end,
      location: document.getElementById("auditLocation").value.trim(),
      requiredTitles: document.getElementById("requiredTitles").value.split(",").map(x => x.trim()).filter(Boolean),
      objectives: document.getElementById("auditObjectives").value.trim(),
      scope: document.getElementById("auditScope").value.trim(),
      criteria: document.getElementById("auditCriteria").value.trim(),
      riskPriorityNote: document.getElementById("auditRisk").value.trim(),
      status: "planned",
      auditeeResponseDueDate: addDays(start, -7),
      preEvaluationDueDate: addDays(start, -1),
      objectionDueDate: addDays(end, 2),
      finalReportDueDate: addDays(end, 15),
      capDueDays: 45,
      capDueDate: "",

      createdBy: state.role,
      createdAt: new Date().toISOString(),
      updatedAt: new Date().toISOString()

    return `<span class="pill ${cls}">${escapeHtml(AUDIT_STATUS[status] || status)}</span>`;

    const next = nextActionForAudit(audit);

  function nextActionForAudit(audit) {
    const map = {
      planned: { status: "waiting_auditee_response", label: "Cevap Sürecine Al" },
      programmed: { status: "planned", label: "Planlandı Yap" },
      waiting_auditee_response: { status: "pre_evaluation", label: "Ön Değerlendirmeye Al" },
      pre_evaluation: { status: "audit_in_progress", label: "Denetimi Başlat" },
      audit_in_progress: { status: "objection_period", label: "İtiraz Sürecine Al" },
      objection_period: { status: "final_report_preparation", label: "Rapor Hazırlığa Al" },
      final_report_preparation: { status: "final_report_sent", label: "Nihai Rapor Gönderildi" },
      final_report_sent: { status: "cap_waiting", label: "CAP Bekleniyor" },
      cap_waiting: { status: "cap_under_review", label: "CAP Değerlendir" },
      cap_under_review: { status: "cap_monitoring", label: "CAP İzlemeye Al" },
      cap_monitoring: { status: "closed", label: "Denetimi Kapat" }
    };
    return map[audit.status];

  window.advanceAudit = async function(auditId, status) {
    const audit = state.audits.find(a => a.auditId === auditId || a.id === auditId);
    if (!audit) return;
    const patch = { status };
    if (status === "final_report_sent") {
      patch.finalReportSentDate = today();
      patch.capDueDate = addDays(today(), 45);
    }
    if (status === "cap_waiting" && !audit.capDueDate) patch.capDueDate = addDays(audit.finalReportSentDate || today(), 45);
    await updateRecord(COLLECTIONS.audits, auditId, patch);
    await loadData();
    renderAll();
    showSection(state.currentSection);
  };
  window.archiveAudit = async function(auditId) {
    if (!confirm("Denetim arşivlensin mi?")) return;
    await updateRecord(COLLECTIONS.audits, auditId, { status: "archived", archivedAt: new Date().toISOString() });
    await loadData(); renderAll(); showSection(state.currentSection);
  };
  window.showAuditDetails = function(auditId) {

  window.exportPhase1Json = function() {
    const data = {

      orgContext: state.orgContext,
      collections: COLLECTIONS,
      auditStatuses: AUDIT_STATUS,
      capStatuses: CAP_STATUS,
      auditPrograms: state.auditPrograms,
      audits: state.audits,
      organizations: state.organizations,
      findings: state.findings,
      capPlans: state.capPlans,
      capSteps: state.capSteps,
      formRevisions: state.formRevisions
    };
    const blob = new Blob([JSON.stringify(data, null, 2)], { type: "application/json;charset=utf-8" });
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url;
    a.download = "usoap_phase1_export.json";
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    URL.revokeObjectURL(url);
  };

      showSection("home");
    } catch (err) {
      setTitle("Yükleme Hatası", "Master veri veya yapı yüklenemedi.");
      document.getElementById("home").innerHTML = `<div class="danger-banner">${escapeHtml(err.message)}</div>`;
      document.getElementById("home").classList.add("active");
    }
  }

  init();
</script>
</body>
</html>
